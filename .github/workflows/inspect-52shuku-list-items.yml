name: Inspect 52shuku chapter list items
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-52shuku-list-items.js"
      - ".github/workflows/inspect-52shuku-list-items.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Inspect chapter list item structure
        run: node scripts/inspect-52shuku-list-items.js
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: 52shuku-list-item-inspection
          path: reports/52shuku-list-item-inspection.json
          retention-days: 30
