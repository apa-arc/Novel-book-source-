name: Inspect selected GET-compatible source candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-selected-candidates.js"
      - ".github/workflows/inspect-selected-candidates.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Inspect selected candidate sites
        run: node scripts/inspect-selected-candidates.js
      - name: Upload sanitized inspection
        uses: actions/upload-artifact@v4
        with:
          name: selected-candidate-inspection
          path: reports/selected-candidate-homepage-inspection.json
          retention-days: 30
