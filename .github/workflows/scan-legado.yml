name: Scan AOAOSTAR Legado collections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "imports/aoaostar/catalog.json"
      - "scripts/scan-legado-collections.js"
      - ".github/workflows/scan-legado.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan all registered collections
        run: npm run scan-legado -- --output=reports/aoaostar-scan.json
      - name: Publish metadata-only catalogues
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/aoaostar-scan.json', 'utf8'));
          const common = {
            schemaVersion: 1,
            provider: 'AOAOSTAR / Legado',
            upstreamRepository: 'https://github.com/aoaostar/legado',
            upstreamLicense: 'AGPL-3.0 declared by upstream repository; individual file provenance and redistribution rights are not assessed',
            generatedAt: report.generatedAt,
            notice: 'Metadata-only discovery catalogue. Contains no source rules, scripts, headers, cookies, tokens, credentials or novel content. Status does not indicate authorization or runtime availability.'
          };
          const publicCatalog = {
            ...common,
            purpose: 'Public discovery and review directory for deduplicated source metadata.',
            totalUniqueSources: report.publicCatalog.length,
            sources: report.publicCatalog
          };
          fs.writeFileSync('imports/aoaostar/public-catalog.json', JSON.stringify(publicCatalog, null, 2) + '\n');
          const candidateReview = {
            ...common,
            purpose: 'Candidate queue for compatibility review; candidate status is preliminary.',
            sourceCount: report.candidateReview.length,
            sources: report.candidateReview.map(item => ({
              ...item,
              reviewStatus: 'unreviewed',
              redistributionStatus: 'not-assessed',
              runtimeStatus: 'not-converted'
            }))
          };
          fs.writeFileSync('imports/aoaostar/candidate-review.json', JSON.stringify(candidateReview, null, 2) + '\n');
          console.log(JSON.stringify({
            scannedCollections: report.totals.scannedCollections,
            rawRecords: report.totals.sources,
            uniqueSources: report.publicCatalog.length,
            candidates: report.candidateReview.length,
            failedCollections: report.totals.failedCollections
          }, null, 2));
          NODE
      - name: Commit sanitized catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add imports/aoaostar/public-catalog.json imports/aoaostar/candidate-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish metadata-only source discovery catalogue"
            git push
          fi
      - name: Upload sanitized scan report
        uses: actions/upload-artifact@v4
        with:
          name: aoaostar-scan-report
          path: reports/aoaostar-scan.json
          if-no-files-found: error
          retention-days: 90
