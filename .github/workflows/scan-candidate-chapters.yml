name: Scan candidate novel chapters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scan-candidate-chapters.js"
      - "scripts/scan-candidate-chapters-cli.js"
      - "runtime/text-quality.js"
      - "imports/aoaostar/candidate-review.json"
      - "imports/aoaostar/license-review.json"
      - "scripts/aggregate-candidate-assessment.js"
      - "scripts/test-candidate-assessment.js"
      - ".github/workflows/scan-candidate-chapters.yml"

permissions:
  contents: write

concurrency:
  group: candidate-chapter-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 100, 200, 300]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan public sitemap chapter samples
        run: node scripts/scan-candidate-chapters-cli.js --limit=100 --offset=${{ matrix.offset }}
      - name: Upload metadata-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-novel-chapter-scan-${{ matrix.offset }}
          path: artifacts/candidate-chapter-scan.json
          if-no-files-found: error
          retention-days: 30


  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scan revision
        id: freshness
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all scan batches
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-novel-chapter-scan-*
          path: artifacts/scans
          merge-multiple: false
      - name: Build per-source accessibility, license and technical assessment
        if: steps.freshness.outputs.current == 'true'
        run: node scripts/aggregate-candidate-assessment.js artifacts/scans
      - name: Commit assessment report
        if: steps.freshness.outputs.current == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/aoaostar/candidate-assessment.json reports/aoaostar-candidate-assessment-summary.md
          if git diff --cached --quiet; then
            echo "Assessment report unchanged."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main moved during aggregation; skipping stale assessment commit."
            exit 0
          fi
          git commit -m "chore: update AOAOSTAR candidate assessment"
          git push origin HEAD:main
