name: Scan candidate novel chapters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scan-candidate-chapters.js"
      - "scripts/scan-candidate-chapters-cli.js"
      - "runtime/text-quality.js"
      - "imports/aoaostar/candidate-review.json"
      - ".github/workflows/scan-candidate-chapters.yml"

permissions:
  contents: read

concurrency:
  group: candidate-chapter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 100, 200, 300]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan public sitemap chapter samples
        run: node scripts/scan-candidate-chapters-cli.js --limit=100 --offset=${{ matrix.offset }}
      - name: Upload metadata-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-novel-chapter-scan-${{ matrix.offset }}
          path: artifacts/candidate-chapter-scan.json
          if-no-files-found: error
          retention-days: 30
