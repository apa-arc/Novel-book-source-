name: Inspect non-form candidate search interfaces
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-noform-search-candidates.js"
      - ".github/workflows/inspect-noform-search-candidates.yml"
permissions:
  contents: write
concurrency:
  group: candidate-noform-search-inspection
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Inspect non-form search interfaces
        run: node scripts/inspect-noform-search-candidates.js
      - name: Commit sanitized inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate-noform-search-inspection.json
          if ! git diff --cached --quiet; then
            git commit -m "Inspect candidate search interfaces without forms"
            git pull --rebase origin main
            git push
          fi
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-noform-search-inspection
          path: reports/candidate-noform-search-inspection.json
          retention-days: 60
