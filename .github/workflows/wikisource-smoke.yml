name: Wikisource live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/smoke-zh-wikisource.js"
      - "runtime/text-quality.js"
      - ".github/workflows/wikisource-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live Wikisource API, pages, and text quality
        run: node scripts/smoke-zh-wikisource.js
      - name: Upload article quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikisource-text-quality-report
          path: artifacts/text-quality-report.json
          if-no-files-found: ignore
          retention-days: 30