name: Wikisource live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/smoke-zh-wikisource.js"
      - ".github/workflows/wikisource-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live Wikisource API and pages
        run: node scripts/smoke-zh-wikisource.js
