name: Probe normalized redirect source candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe-normalized-redirect-candidates.js"
      - ".github/workflows/probe-normalized-redirect-candidates.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Probe normalized domains and GET search forms
        run: node scripts/probe-normalized-redirect-candidates.js
      - name: Commit sanitized probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/redirect-normalized-search-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Probe normalized redirect source candidates"
            git pull --rebase origin main
            git push
          fi
      - name: Upload normalized search probe
        uses: actions/upload-artifact@v4
        with:
          name: redirect-normalized-search-probe
          path: reports/redirect-normalized-search-probe.json
          retention-days: 60
