name: Inspect Hotread GET search candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-hotread.js"
      - ".github/workflows/inspect-hotread.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Inspect Hotread GET search results
        run: node scripts/inspect-hotread.js
      - name: Upload sanitized search inspection
        uses: actions/upload-artifact@v4
        with:
          name: hotread-search-inspection
          path: reports/hotread-search-inspection.json
          retention-days: 30
