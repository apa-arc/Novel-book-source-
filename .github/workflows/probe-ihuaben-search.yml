name: Probe Huaben GET search titles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe-ihuaben-search.js"
      - ".github/workflows/probe-ihuaben-search.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock linkedom
      - run: node scripts/probe-ihuaben-search.js
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ihuaben-search-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Probe Huaben novel search results"
            git pull --rebase origin main
            git push
          fi
