name: Check candidate GET search compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe-candidate-search-compatibility.js"
      - ".github/workflows/probe-candidate-search-compatibility.yml"
permissions:
  contents: write
concurrency:
  group: candidate-search-compatibility
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Check GET search and charset
        run: node scripts/probe-candidate-search-compatibility.js
      - name: Commit metadata-only compatibility results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate-search-compatibility.json
          if ! git diff --cached --quiet; then
            git commit -m "Check candidate GET search compatibility"
            git pull --rebase origin main
            git push
          fi
      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-search-compatibility
          path: reports/candidate-search-compatibility.json
          retention-days: 90
