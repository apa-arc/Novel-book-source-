name: Scan additional ordinary novel source catalogue

on:
  push:
    branches: [main]
    paths:
      - "scripts/scan-liufuyou-catalog.js"
      - "scripts/scan-liufuyou-chapters.js"
      - ".github/workflows/scan-liufuyou-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liufuyou-source-discovery
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build metadata-only candidate catalogue
        run: node scripts/scan-liufuyou-catalog.js
      - name: Commit sanitized discovery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add imports/third-party/liufuyou/candidate-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Add metadata-only novel source discovery catalogue"
            git pull --rebase origin main
            git push
          fi

  chapter-scan:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 100, 200, 300, 400]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan public chapter samples
        env:
          SCAN_OFFSET: ${{ matrix.offset }}
        run: node scripts/scan-liufuyou-chapters.js
      - name: Upload metadata-only chapter screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liufuyou-chapter-scan-${{ matrix.offset }}
          path: reports/liufuyou-chapter-scan-${{ matrix.offset }}.json
          if-no-files-found: error
          retention-days: 30
