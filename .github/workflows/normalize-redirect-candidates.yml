name: Normalize redirected candidate domains
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/normalize-redirect-candidates.js"
      - ".github/workflows/normalize-redirect-candidates.yml"
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize final HTTPS hosts from observed redirects
        run: node scripts/normalize-redirect-candidates.js
      - name: Commit normalized candidate metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/redirect-normalized-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Normalize redirected novel source candidate domains"
            git pull --rebase origin main
            git push
          fi
      - name: Upload normalized candidate list
        uses: actions/upload-artifact@v4
        with:
          name: redirect-normalized-candidates
          path: reports/redirect-normalized-candidates.json
          retention-days: 60
