name: Live functional tests for novel sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/live-test-app-runtime.ts"
      - "scripts/app-runtime-classification.ts"
      - "scripts/test-app-runtime-classification.ts"
      - "scripts/diagnose-app-runtime-network.ts"
      - "config/source-scan-import-rules.json"
      - "config/health-check-subscription.json"
      - "subscription.json"
      - "sources/*.json"
      - ".github/workflows/live-functional-test-legado.yml"

permissions:
  contents: read

concurrency:
  group: live-app-subscription-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: apa-arc/AppleNovelApp
          ref: v1.1.6-dev
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript runner
        run: npm install --no-save --no-package-lock tsx
      - name: Verify conservative search failure classification
        run: npx tsx scripts/test-app-runtime-classification.ts
      - name: Run live tests with AppleNovelApp runtime
        run: npx tsx scripts/live-test-app-runtime.ts
      - name: Diagnose search network and user-agent differences
        run: npx tsx scripts/diagnose-app-runtime-network.ts
      - name: Upload per-source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-runtime-live-test-report
          path: |
            reports/app-runtime-live-test.json
            reports/app-runtime-network-diagnostics.json
          retention-days: 90
