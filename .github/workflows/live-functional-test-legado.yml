name: Live functional tests for novel sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/live-test-app-subscription.js"
      - ".github/workflows/live-functional-test-legado.yml"

permissions:
  contents: read

concurrency:
  group: live-app-subscription-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock linkedom
      - name: Run live tests for all 26 subscription sources
        run: node scripts/live-test-app-subscription.js
      - name: Upload per-source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-subscription-live-test-report
          path: reports/app-subscription-live-test.json
          retention-days: 90
