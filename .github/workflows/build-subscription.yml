name: Build subscriptions

on:
  push:
    branches: [main]
    paths:
      - "index.json"
      - "adult-index.json"
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/build-subscription.yml"
  workflow_dispatch:

concurrency:
  group: build-source-subscriptions
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ordinary and adult subscription manifests
        run: node scripts/build-subscription.js
      - name: Commit updated manifests
        run: |
          if git diff --quiet -- app-subscription.json adult-app-subscription.json; then
            echo "Subscription manifests are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-subscription.json adult-app-subscription.json
          git commit -m "chore: update ordinary and adult subscriptions"
          git push
