name: Build the single ordinary novel subscription

on:
  push:
    branches: [main]
    paths:
      - "index.json"
      - "sources/**"
      - ".github/workflows/build-subscription.yml"
  workflow_dispatch:

concurrency:
  group: build-novel-subscription
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single ordinary subscription
        run: node scripts/build-subscription.js
      - name: Commit updated subscription manifest
        run: |
          if git diff --quiet -- subscription.json; then
            echo "subscription.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          git commit -m "chore: update novel source subscription"
          git push
