name: Batch compatibility review for AOAOSTAR candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/batch-convert-aoaostar.js"
      - ".github/workflows/batch-convert-aoaostar.yml"
      - "scripts/convert-legado-rules.js"

permissions:
  contents: write

jobs:
  batch-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate converter and tests
        run: npm run validate
      - name: Build sanitized report for all 704 candidates
        run: node scripts/batch-convert-aoaostar.js
      - name: Commit metadata-only conversion progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add imports/aoaostar/conversion-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sanitized source conversion progress"
            git push
          fi
      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: aoaostar-conversion-review
          path: reports/aoaostar-conversion-review.json
          if-no-files-found: error
          retention-days: 90
